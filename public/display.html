<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bahaya Shop - Display</title>
<style>
  :root{--bg:#0b1220;--brand:#0ea5e9;--green:#22c55e;--muted:#64748b;--card:#16223a}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(circle at 50% 20%,#132036,#0b1220 70%);
    color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    display:flex;flex-direction:column;height:100vh;overflow:hidden}

  header{text-align:center;padding:2vh 0 1vh;flex:0 0 auto}
  .logo{font-size:4.5vh;font-weight:900;letter-spacing:3px}
  .logo span{color:var(--brand)}

  .main{flex:1;display:flex;min-height:0;padding:0 2vw 2vh;gap:2vw}

  /* Venstre: kaldt ind nu */
  .called-col{flex:1.3;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--card);border-radius:24px;padding:2vh 1vw;min-width:0}
  .callbox{text-align:center}
  .callbox.flash{animation:pop 2s ease}
  @keyframes pop{0%{transform:scale(1)}10%{transform:scale(1.3)}35%{transform:scale(1.3)}100%{transform:scale(1)}}
  .call-label{font-size:3vh;font-weight:800;color:var(--green);margin-bottom:1vh}
  .call-label .da{color:#cbd5e1;font-weight:500;font-size:2.2vh}
  .nr{font-size:20vh;font-weight:900;line-height:.9;color:#fff}
  .nr small{font-size:6vh;color:var(--brand);vertical-align:top;margin-right:1vh}
  .cname{font-size:5vh;font-weight:800;margin-top:1vh}
  .cservice{font-size:3vh;color:var(--muted);margin-top:.5vh;font-weight:600}
  .idle{text-align:center;color:var(--muted)}
  .idle .big{font-size:5vh;font-weight:800;color:#cbd5e1}
  .idle .small{font-size:2.6vh;margin-top:1vh;line-height:1.4}

  .statusbox{text-align:center}
  .stat-emoji{font-size:14vh;line-height:1}
  .stat-title{font-size:7vh;font-weight:900;color:#fbbf24;margin-top:1vh}
  .stat-sub{font-size:3vh;color:#cbd5e1;margin-top:1.5vh;line-height:1.4}

  /* Højre: venter-liste */
  .wait-col{flex:1;display:flex;flex-direction:column;min-width:0}
  .wait-head{font-size:3vh;font-weight:800;margin-bottom:1.2vh;color:#e2e8f0;flex:0 0 auto}
  .wait-head .da{color:var(--muted);font-weight:500;font-size:2vh}
  .wait-head .count{color:var(--brand)}
  .wait-list{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:1vh}
  .wait-row{display:flex;align-items:center;gap:1.2vw;background:var(--card);border-radius:14px;
    padding:1.4vh 1.4vw}
  .wait-row .wnr{font-size:4.4vh;font-weight:900;min-width:2.4em}
  .wait-row .wnr small{font-size:1.8vh;color:var(--muted);display:block;font-weight:600;line-height:1}
  .wait-row .wname{flex:1;font-size:3.2vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wait-row .wsvc{display:flex;align-items:center;gap:.6vw;font-size:2.2vh;color:var(--muted);font-weight:600}
  .sdot{width:1.6vh;height:1.6vh;border-radius:50%}
  .sdot.MoneyGram{background:#f97316}.sdot.Ria{background:#a855f7}.sdot.Western{background:#facc15}.sdot.Bahaya{background:#14b8a6}
  .wait-empty{color:var(--muted);font-size:2.6vh;text-align:center;margin-top:4vh}
  .wait-more{color:var(--muted);font-size:2.2vh;text-align:center;padding-top:.5vh}

  footer{text-align:center;padding:1vh;color:var(--muted);font-size:2vh;flex:0 0 auto}
  .clock{font-weight:700;color:#cbd5e1}
</style>
</head>
<body>
  <header><div class="logo">BAHAYA <span>SHOP</span></div></header>

  <div class="main">
    <!-- Kaldt ind nu -->
    <div class="called-col">
      <div id="idle" class="idle">
        <div class="big">Fadlan sug &middot; Vent venligst</div>
        <div class="small">Numarkaaga ayaa halkan lagu tusi doonaa<br>Dit nummer vises her</div>
      </div>
      <div id="callbox" class="callbox" style="display:none">
        <div class="call-label">Fadlan soo gal<div class="da">Venligst kom ind</div></div>
        <div class="nr"><small>NR</small><span id="nr">0</span></div>
        <div class="cname" id="cname"></div>
        <div class="cservice" id="cservice"></div>
      </div>
      <div id="statusBox" class="statusbox" style="display:none">
        <div class="stat-emoji" id="statEmoji">☕</div>
        <div class="stat-title" id="statTitle"></div>
        <div class="stat-sub" id="statSub"></div>
      </div>
    </div>

    <!-- Venter-liste -->
    <div class="wait-col">
      <div class="wait-head">Sugaya <span class="count" id="waitCount">0</span>
        <span class="da">&middot; Venter i kø</span></div>
      <div class="wait-list" id="waitList"></div>
    </div>
  </div>

  <footer><span class="clock" id="clock"></span> &middot; Bahaya Shop Digital Kø</footer>

<script>
  var lastSeq = -1;
  var callbox = document.getElementById('callbox');
  var idle = document.getElementById('idle');

  function sdotClass(svc){ return svc==='Western Union' ? 'Western' : (svc==='Bahaya Shop' ? 'Bahaya' : svc); }
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  function showCalled(c){
    idle.style.display='none';
    callbox.style.display='block';
    document.getElementById('nr').textContent = c.number;
    document.getElementById('cname').textContent = c.name || '';
    document.getElementById('cservice').textContent = c.service || '';
} 
 
  function speakCalled(c) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();

  var msg = new SpeechSynthesisUtterance(
    'Nummer ' + c.number + ', ' + (c.name || '') +
    ', kom venligst frem.'
  );
  msg.lang = 'da-DK';
  msg.rate = 0.85;
  msg.volume = 1;
  window.speechSynthesis.speak(msg);
}
  function showIdle(){
    idle.style.display='block';
    callbox.style.display='none';
  }
  function animate(){
    callbox.classList.remove('flash');
    void callbox.offsetWidth;
    callbox.classList.add('flash');
    chime();
  }

  function renderWaiting(tickets){
    var waiting = tickets.filter(function(t){return t.status==='waiting';});
    waiting.sort(function(a,b){return a.number-b.number;});
    document.getElementById('waitCount').textContent = waiting.length;
    var list = document.getElementById('waitList');
    if(waiting.length===0){
      list.innerHTML = '<div class="wait-empty">Ma jiro cid sugaysa &middot; Ingen venter</div>';
      return;
    }
    var show = waiting.slice(0, 8); // vis de foerste 8 paa skaermen
    var html = show.map(function(t){
      return '<div class="wait-row">'+
        '<div class="wnr"><small>NR</small>'+t.number+'</div>'+
        '<div class="wname">'+esc(t.name)+'</div>'+
        '<div class="wsvc"><span class="sdot '+sdotClass(t.service)+'"></span>'+esc(t.service)+'</div>'+
      '</div>';
    }).join('');
    if(waiting.length>show.length){
      html += '<div class="wait-more">+ '+(waiting.length-show.length)+' flere venter...</div>';
    }
    list.innerHTML = html;
  }

  var statusBox = document.getElementById('statusBox');
  function showStaffStatus(status){
    idle.style.display='none';
    callbox.style.display='none';
    statusBox.style.display='block';
    if(status==='salah'){
      document.getElementById('statEmoji').textContent='🕌';
      document.getElementById('statTitle').textContent='SALAAD · BØN';
      document.getElementById('statSub').innerHTML='Waa la tukanayaa &middot; Vi beder<br>Waan soo laabanaynaa / Vi er straks tilbage';
    } else {
      document.getElementById('statEmoji').textContent='🍽️';
      document.getElementById('statTitle').textContent='NASASHO · PAUSE';
      document.getElementById('statSub').innerHTML='Waan soo laabanaynaa / Vi er straks tilbage';
    }
  }

  function poll(){
    fetch('/api/state').then(function(r){return r.json();}).then(function(d){
      // Venter-listen (opdaterer med det samme en kunde tager nummer)
      renderWaiting(d.tickets || []);

      // Medarbejder på pause/bøn -> vis besked i stedet for kaldt-ind
      if(d.staffStatus && d.staffStatus!=='active'){
        showStaffStatus(d.staffStatus);
        lastSeq = d.lastCalled ? d.lastCalled.seq : -1; // undgå animation når vi kommer tilbage
        return;
      }
      statusBox.style.display='none';

      // Kaldt ind nu
      if(d.lastCalled){
        showCalled(d.lastCalled);
        if(d.lastCalled.seq !== lastSeq){
          if(lastSeq !== -1) animate();
          if(lastSeq !== -1) speakCalled(d.lastCalled);
          lastSeq = d.lastCalled.seq;
        }
      } else {
        showIdle();
        lastSeq = -1;
      }
    }).catch(function(){});
  }
  poll();
  setInterval(poll, 1200);

  function tick(){
    var n=new Date();
    document.getElementById('clock').textContent =
      String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  }
  tick(); setInterval(tick, 10000);

  function chime(){
    try{
      var ctx = new (window.AudioContext||window.webkitAudioContext)();
      [0,0.18,0.36].forEach(function(t,i){
        var o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sine';o.frequency.value=[660,880,1046][i];
        g.gain.setValueAtTime(0.001,ctx.currentTime+t);
        g.gain.exponentialRampToValueAtTime(0.4,ctx.currentTime+t+0.03);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.5);
        o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.55);
      });
    }catch(e){}
  }
  document.body.addEventListener('click', function(){ chime(); }, {once:true});
</script>
</body>
</html>
